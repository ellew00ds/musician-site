<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sterling Steffen · Musician · Austin, TX</title>
  <meta name="description" content="Sterling Steffen — musician based in Austin, Texas. Official site, links, and booking." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://sterlingsteffen.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sterling Steffen" />
  <meta property="og:description" content="Musician based in Austin, Texas. Official site and booking." />
  <meta property="og:url" content="https://sterlingsteffen.com/" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Sterling Steffen" />
  <meta name="twitter:description" content="Musician based in Austin, Texas. Official site and booking." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(1rem, 3vh, 1.75rem) 2rem 2rem;
      background: #0a0a0a;
      color: #e6e6e6;
      font-family: 'Syne', system-ui, sans-serif;
      font-size: 0.9375rem;
      line-height: 1.5;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 36rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Shrink-wraps to the title so it stays centered like a lone block; button is out of flow */
    .artist-anchor {
      position: relative;
      display: inline-block;
      width: fit-content;
      max-width: 100%;
    }

    .artist-name {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15em;
    }

    .artist-name__given {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(0.7rem, 2.2vw, 0.85rem);
      letter-spacing: 0.55em;
      text-transform: uppercase;
      text-indent: 0.55em;
      color: #5c5c5c;
    }

    .artist-name__family {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.25rem, 14vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.02em;
      background: linear-gradient(165deg, #f5f5f5 0%, #a8a8a8 45%, #eaeaea 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.06));
    }

    .tag {
      margin-top: 1.35rem;
      font-family: 'Syne', sans-serif;
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-indent: 0.35em;
      color: #4a4a4a;
    }

    .booking-cta {
      display: inline-block;
      margin-bottom: clamp(2rem, 6vh, 3.5rem);
      padding: 1em 2.5em;
      min-height: 3.25rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(0.8rem, 2.8vw, 1rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-decoration: none;
      text-indent: 0.32em;
      color: #b0b0b0;
      border: 1px solid #3d3d3d;
      border-radius: 999px;
      transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .booking-cta:hover {
      color: #f0f0f0;
      border-color: #6a6a6a;
      background: rgba(255, 255, 255, 0.04);
    }

    footer {
      margin-top: auto;
      padding-top: 4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.75rem;
      justify-content: center;
      align-items: center;
    }

    .social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      color: #6a6a6a;
      text-decoration: none;
      border-radius: 50%;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .social:hover {
      color: #c8c8c8;
      background: rgba(255, 255, 255, 0.05);
    }

    .social:active {
      transform: scale(0.96);
    }

    .social svg {
      display: block;
      width: 1.35rem;
      height: 1.35rem;
      overflow: visible;
    }

    /* Full-height left strip: large target, faintly visible so you can find it */
    .secret-hit {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 2;
      width: calc(3.75rem + env(safe-area-inset-left, 0px));
      min-width: 3.25rem;
      padding-left: env(safe-area-inset-left, 0px);
      box-sizing: border-box;
      border: none;
      border-radius: 0;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 180ms ease;
    }

    .secret-hit:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .secret-hit:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.45);
      outline-offset: -2px;
    }

    .secret-hit.is-playing {
      background: rgba(255, 255, 255, 0.1);
    }

    .secret-hit.is-playing:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Hidden Bandcamp embed (needs real dimensions for playback) */
    .bandcamp-embed-host {
      position: fixed;
      width: 400px;
      height: 120px;
      left: -9999px;
      top: auto;
      bottom: 0;
      overflow: hidden;
      pointer-events: none;
      border: 0;
      opacity: 0;
    }

    .bandcamp-embed-host iframe {
      display: block;
      border: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <main>
    <a class="booking-cta" href="https://example.com/booking" target="_blank" rel="noopener noreferrer">Book</a>
    <div class="artist-anchor">
      <h1 class="artist-name">
        <span class="artist-name__given">Sterling</span>
        <span class="artist-name__family">Steffen</span>
      </h1>
    </div>
    <p class="tag">Austin · TX</p>
  </main>

  <footer>
    <a class="social" href="#" target="_blank" rel="noopener" aria-label="Bandcamp">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M0 18.75l7.437-13.5H24l-7.438 13.5H0z" />
      </svg>
    </a>
    <a class="social" href="#" target="_blank" rel="noopener" aria-label="Tidal">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12.012 3.992L8.008 7.996 4.004 3.992 0 7.996 4.004 12l4.004-4.004L12.012 12l-4.004 4.004 4.004 4.004 4.004-4.004L12.012 12l4.004-4.004-4.004-4.004zM16.042 7.996l3.979-3.979L24 7.996l-3.979 3.979z" />
      </svg>
    </a>
    <a class="social" href="#" target="_blank" rel="noopener" aria-label="Mixcloud">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M2.462 8.596l1.372 6.49h.319l1.372-6.49h2.462v6.808H6.742v-5.68l.232-.81h-.402l-1.43 6.49H2.854l-1.44-6.49h-.391l.222.81v5.68H0V8.596zM24 8.63v1.429L21.257 12 24 13.941v1.43l-3.235-2.329h-.348l-3.226 2.329v-1.43l2.734-1.94-2.733-1.942V8.63l3.225 2.338h.348zm-7.869 2.75v1.24H9.304v-1.24z" />
      </svg>
    </a>
    <a class="social" href="mailto:booking@example.com" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="M3 7l9 6 9-6" />
      </svg>
    </a>
  </footer>

  <div class="bandcamp-embed-host" aria-hidden="true">
    <iframe
      id="bandcamp-embed"
      title="Bandcamp"
      src="about:blank"
      loading="lazy"
      allow="autoplay; encrypted-media"
    ></iframe>
  </div>
  <button type="button" class="secret-hit" id="secret-hit" aria-label="Play random Bandcamp track"></button>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "Sterling Steffen",
    "url": "https://sterlingsteffen.com/",
    "description": "Musician based in Austin, Texas.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Austin",
      "addressRegion": "TX",
      "addressCountry": "US"
    }
  }
  </script>

  <script>
    (function () {
      /*
       * Bandcamp does not expose a public “random track” API for static sites.
       * Add numeric track IDs from your Bandcamp: open a track → Share → Embed → copy the number after track=
       */
      var BANDCAMP_TRACK_IDS = [
        /* e.g. 1234567890, */
      ];

      var btn = document.getElementById('secret-hit');
      var iframe = document.getElementById('bandcamp-embed');
      if (!btn || !iframe) return;

      var playing = false;

      function embedUrl(trackId) {
        return (
          'https://bandcamp.com/EmbeddedPlayer/track=' +
          encodeURIComponent(String(trackId)) +
          '/size=large/bgcol=0a0a0a/linkcol=e8e8e8/tracklist=false/transparent=true/'
        );
      }

      function stop() {
        iframe.src = 'about:blank';
        playing = false;
        btn.classList.remove('is-playing');
        btn.setAttribute('aria-label', 'Play random Bandcamp track');
      }

      function playRandom() {
        if (!BANDCAMP_TRACK_IDS.length) {
          console.warn('Add track IDs to BANDCAMP_TRACK_IDS in index.html (Bandcamp → track → Share → Embed).');
          return;
        }
        var i = Math.floor(Math.random() * BANDCAMP_TRACK_IDS.length);
        var id = BANDCAMP_TRACK_IDS[i];
        iframe.src = embedUrl(id) + '?cb=' + Date.now();
        playing = true;
        btn.classList.add('is-playing');
        btn.setAttribute('aria-label', 'Stop Bandcamp playback');
      }

      btn.addEventListener('click', function () {
        if (playing) {
          stop();
        } else {
          playRandom();
        }
      });
    })();
  </script>
</body>
</html>
